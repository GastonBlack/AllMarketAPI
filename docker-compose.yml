services:
  api:
    build: .
    container_name: allmarket-api
    ports:
      - "5095:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=AllMarketDb;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy
  
  postgres:
    image: postgres:18
    container_name: allmarket-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: AllMarketDb
    ports:
      - "5433:5432"
    volumes:
      - allmarket-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d AllMarketDb"]
      interval: 5s
      timeout: 10s
      retries: 5

volumes:
  allmarket-postgres-data:
